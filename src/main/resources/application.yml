spring:
  application:
    name: biciclo-api
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      # O schema é gerenciado pelo Flyway (migrações em db/migration).
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Configurações específicas do domínio Biciclo (bindadas em JwtProperties)
app:
  jwt:
    secret: ${JWT_SECRET:mude-esta-chave-em-producao-para-uma-string-longa-e-aleatoria-de-64-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
